<svg xmlns="http://www.w3.org/2000/svg" width="1084" height="310" viewBox="0 0 1084 310" role="img" aria-label="Packet layout">
<style>
  text { font-family: ui-monospace, Consolas, monospace; fill: #d7dde4; text-anchor: middle; }
