  .note { font-size: 11px; fill: #8b949e; }
  .off { font-size: 11px; fill: #5cc8ff; text-anchor: start; }
  .title { font-size: 14px; font-weight: 600; text-anchor: start; font-family: system-ui, sans-serif; }
  .sub, .foot { font-size: 12px; fill: #8b949e; text-anchor: start; font-family: system-ui, sans-serif; }
</style>
<rect width="100%" height="100%" fill="#0d1117"/>
<text x="20" y="22" class="title">orbit-desk packet, version 1 · little-endian · one source at one mission time</text><rect x="20" y="52" width="128" height="56" rx="4" fill="#16202b" stroke="#30363d"/><text x="84" y="76" class="name">magic</text><text x="84" y="94" class="note">0x4F44</text><text x="23" y="46" class="off">0</text><rect x="148" y="52" width="64" height="56" rx="4" fill="#16202b" stroke="#30363d"/><text x="180" y="76" class="name">ver</text><text x="180" y="94" class="note">1</text><text x="151" y="46" class="off">2</text><rect x="212" y="52" width="64" height="56" rx="4" fill="#16202b" stroke="#30363d"/><text x="244" y="76" class="name">flags</text><text x="244" y="94" class="note">u8</text><text x="215" y="46" class="off">3</text><rect x="276" y="52" width="128" height="56" rx="4" fill="#16202b" stroke="#30363d"/><text x="340" y="76" class="name">source</text><text x="340" y="94" class="note">u16</text><text x="279" y="46" class="off">4</text><rect x="404" y="52" width="128" height="56" rx="4" fill="#16202b" stroke="#30363d"/><text x="468" y="76" class="name">seq</text><text x="468" y="94" class="note">u16</text><text x="407" y="46" class="off">6</text><rect x="532" y="52" width="256" height="56" rx="4" fill="#16202b" stroke="#30363d"/><text x="660" y="76" class="name">mission time</text><text x="660" y="94" class="note">u32, ms</text><text x="535" y="46" class="off">8</text><rect x="788" y="52" width="128" height="56" rx="4" fill="#16202b" stroke="#30363d"/><text x="852" y="76" class="name">payload len</text><text x="852" y="94" class="note">u16 = 7n</text><text x="791" y="46" class="off">12</text><rect x="916" y="52" width="64" height="56" rx="4" fill="#16202b" stroke="#30363d"/><text x="948" y="76" class="name">n</text><text x="948" y="94" class="note">u8</text><text x="919" y="46" class="off">14</text><rect x="980" y="52" width="64" height="56" rx="4" fill="#16202b" stroke="#30363d"/><text x="1012" y="76" class="name">rsv</text><text x="1012" y="94" class="note">0</text><text x="983" y="46" class="off">15</text><text x="20" y="128" class="sub">header: 16 bytes · flags bit 0 = retransmitted · source 1 EPS, 2 COMMS, 3 ADCS · seq counts per source and wraps at 65536</text><text x="20" y="164" class="sub">payload: n samples of 7 bytes (q = quality: 0 good, 1 suspect, 2 bad), then the CRC</text><rect x="20" y="190" width="128" height="56" rx="4" fill="#1b2a1f" stroke="#30363d"/><text x="84" y="214" class="name">channel</text><text x="84" y="232" class="note">u16</text><text x="23" y="184" class="off">16</text><rect x="148" y="190" width="256" height="56" rx="4" fill="#1b2a1f" stroke="#30363d"/><text x="276" y="214" class="name">value</text><text x="276" y="232" class="note">f32</text><text x="151" y="184" class="off">18</text><rect x="404" y="190" width="64" height="56" rx="4" fill="#1b2a1f" stroke="#30363d"/><text x="436" y="214" class="name">q</text><text x="436" y="232" class="note">u8</text><text x="407" y="184" class="off">22</text><rect x="468" y="190" width="128" height="56" rx="4" fill="#182419" stroke="#30363d"/><text x="532" y="214" class="name">channel</text><text x="532" y="232" class="note">u16</text><text x="471" y="184" class="off">23</text><rect x="596" y="190" width="256" height="56" rx="4" fill="#182419" stroke="#30363d"/><text x="724" y="214" class="name">value</text><text x="724" y="232" class="note">f32</text><text x="599" y="184" class="off">25</text><rect x="852" y="190" width="64" height="56" rx="4" fill="#182419" stroke="#30363d"/><text x="884" y="214" class="name">q</text><text x="884" y="232" class="note">u8</text><text x="855" y="184" class="off">29</text><text x="934" y="224" class="name">…</text><rect x="956" y="190" width="128" height="56" rx="4" fill="#2b1d16" stroke="#30363d"/><text x="1020" y="214" class="name">crc-16</text><text x="1020" y="232" class="note">CCITT-FALSE</text><text x="959" y="184" class="off">16+7n</text><text x="20" y="282" class="foot">CRC over bytes 0 … 16+7n−1. A recording stores each packet as: arrival u32 (ms) · length u16 · packet. A live WebSocket message is: arrival u32 · packet.</text>
